name: CI/CD - Loja Veloz

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/beatriz-preiraa/loja-veloz

jobs:
  # Job 1: Qualidade de Código (Lint) e Validação de Manifestos
  validate:
    name: Lint e Validação
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar linter (flake8) e validar sintaxe
        run: |
          pip install flake8
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 2: Build, Versionamento e Publicação das Imagens
  build-and-push:
    name: Build & Push (${{ matrix.service }})
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [gateway, pedidos, pagamentos, estoque]
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx (Cache)
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry (usando Secret nativo)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da imagem versionada
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:1.0.0
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max