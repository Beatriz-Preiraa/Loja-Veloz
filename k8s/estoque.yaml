apiVersion: apps/v1
kind: Deployment
metadata:
  name: estoque
  namespace: loja-veloz
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: estoque
  template:
    metadata:
      labels:
        app: estoque
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: estoque
          image: ghcr.io/beatriz-preiraa/loja-veloz-estoque:1.0.0
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: veloz-config
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: estoque
  namespace: loja-veloz
spec:
  selector:
    app: estoque
  ports:
    - port: 8003
      targetPort: 8003