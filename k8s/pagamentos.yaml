apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos
  namespace: loja-veloz
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pagamentos
  template:
    metadata:
      labels:
        app: pagamentos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: pagamentos
          image: ghcr.io/beatriz-preiraa/loja-veloz-pagamentos:1.0.0
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: veloz-config
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos
  namespace: loja-veloz
spec:
  selector:
    app: pagamentos
  ports:
    - port: 8002
      targetPort: 8002