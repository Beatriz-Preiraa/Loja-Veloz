global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "loja-veloz-microservices"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "gateway:8000"
          - "pedidos:8001"
          - "pagamentos:8002"
          - "estoque:8003"