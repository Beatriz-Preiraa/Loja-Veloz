services:
  postgres:
    image: postgres:15-alpine
    container_name: veloz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pedidos_db}
      POSTGRES_USER: ${POSTGRES_USER:-veloz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veloz123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - veloz-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloz -d pedidos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: veloz-rabbitmq
    ports:
      - "15672:15672"
    networks:
      - veloz-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway:
    build: ./services/gateway
    image: ghcr.io/beatriz-preiraa/loja-veloz-gateway:1.0.0
    ports:
      - "8000:8000"
    environment:
      PEDIDOS_URL: http://pedidos:8001
    depends_on:
      - pedidos
    networks:
      - veloz-net

  pedidos:
    build: ./services/pedidos
    image: ghcr.io/beatriz-preiraa/loja-veloz-pedidos:1.0.0
    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB:-pedidos_db}
      DB_USER: ${POSTGRES_USER:-veloz}
      DB_PASS: ${POSTGRES_PASSWORD:-veloz123}
      RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - veloz-net

  pagamentos:
    build: ./services/pagamentos
    image: ghcr.io/beatriz-preiraa/loja-veloz-pagamentos:1.0.0
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - veloz-net

  estoque:
    build: ./services/estoque
    image: ghcr.io/beatriz-preiraa/loja-veloz-estoque:1.0.0
    environment:
      RABBITMQ_HOST: rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - veloz-net

volumes:
  pgdata:

networks:
  veloz-net:
    driver: bridge